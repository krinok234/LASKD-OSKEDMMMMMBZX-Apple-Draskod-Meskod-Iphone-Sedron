<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnderCore - Вход / Регистрация</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="snow-container"></div>
    
    <header>
        <div class="logo">
            <h1>EnderCore</h1>
            <p>Лучший Minecraft сервер</p>
        </div>
        <nav>
            <a href="index.html" class="nav-link">Главная</a>
            <a href="index.html#donate" class="nav-link">Донат</a>
            <a href="auth.html" class="nav-link active">Вход</a>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <div class="auth-form-container active" id="login-form">
                <h2>Войти в аккаунт</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label>Email или никнейм</label>
                        <input type="text" id="login-username" placeholder="Введите email или никнейм" required />
                    </div>
                    <div class="input-group">
                        <label>Пароль</label>
                        <input type="password" id="login-password" placeholder="Введите пароль" required />
                    </div>
                    <div class="remember-forgot">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me" />
                            <span>Запомнить меня</span>
                        </label>
                        <a href="#" class="forgot-link">Забыли пароль?</a>
                    </div>
                    <button type="submit" class="btn-primary">Войти</button>
                </form>
                <div class="auth-message" id="login-message"></div>
            </div>

            <!-- Форма регистрации -->
            <div class="auth-form-container" id="register-form">
                <h2>Создать аккаунт</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <label>Никнейм Minecraft</label>
                        <input type="text" id="reg-nickname" placeholder="Ваш игровой никнейм" required minlength="3" maxlength="16" />
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" placeholder="your@email.com" required />
                    </div>
                    <div class="input-group">
                        <label>Пароль</label>
                        <input type="password" id="reg-password" placeholder="Минимум 8 символов" required minlength="8" />
                    </div>
                    <div class="input-group">
                        <label>Подтвердите пароль</label>
                        <input type="password" id="reg-password-confirm" placeholder="Повторите пароль" required />
                    </div>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agree-terms" required />
                            <span>Я согласен с <a href="#">правилами сервера</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn-primary">Зарегистрироваться</button>
                </form>
                <div class="auth-message" id="register-message"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 EnderCore. Все права защищены.</p>
            <p>Сервер не относится к Mojang Studios и Microsoft Corporation</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
